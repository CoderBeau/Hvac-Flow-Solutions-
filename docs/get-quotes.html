<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow"/>
<!-- Redirect stub. The canonical quote form is /get-quotes.html at the repo
     root, which is what GitHub Pages serves (this directory has no index.html
     and is a leftover from an earlier publish-from-/docs setup).

     This file used to be a second, divergent copy of the form: different
     fields, and a `source` radio that wrote the visitor's own "how did you
     hear about us" answer into the same sheet column the ad attribution uses.
     Two forms writing different meanings into one column is how reporting
     quietly goes wrong, so the copy is gone. -->
<meta http-equiv="refresh" content="0;url=/get-quotes.html"/>
<link rel="canonical" href="https://boosthvacleads.com/get-quotes.html"/>
<title>Redirecting to the quote form…</title>
<script>
  // Preserve any campaign parameters across the hop so attribution survives.
  // The guard means this can never loop back onto itself if this directory
  // ever does become the served root.
  var target = '/get-quotes.html';
  if (window.location.pathname !== target) {
    window.location.replace(target + window.location.search + window.location.hash);
  }
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:2rem;text-align:center">
  <p>Redirecting to the quote form…</p>
  <p><a href="/get-quotes.html">Continue to the quote form</a></p>
</body></html>
